<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Flow Visual</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .stage {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 12px;
      align-items: stretch;
    }
    .actor {
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: var(--bg);
      min-height: 220px;
    }
    .actor h3 { margin: 0 0 6px; font-size: 1rem; }
    .actor.browser { border-color: var(--browser); }
    .actor.server { border-color: var(--server); }
    .actor .site { font-size: .8rem; color: var(--muted); word-break: break-all; }
    .jar { margin-top: 10px; font-size: .82rem; }
    .jar .item {
      font-family: ui-monospace, Menlo, monospace;
      background: var(--code-bg);
      border-left: 3px solid var(--accent);
      padding: 4px 6px;
      margin: 4px 0;
      border-radius: 4px;
      word-break: break-all;
      transition: opacity .4s, transform .4s;
    }
    .jar .item.new { animation: pop .6s ease; }
    .jar .item.gone { opacity: .35; text-decoration: line-through; }
    .jar .item.sent { border-left-color: var(--browser); box-shadow: 0 0 0 2px color-mix(in srgb, var(--browser) 35%, transparent); }
    .jar .item.sent::after { content: ' → sent'; font-family: system-ui, sans-serif; font-weight: 600; color: var(--browser); }
    .jar .item.held { opacity: .45; }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
    .actor { transition: box-shadow .3s; }
    .actor.ping { animation: ping .9s ease-out; }
    .actor.browser { --glow: var(--browser); }
    .actor.server { --glow: var(--server); }
    @keyframes ping {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--glow) 55%, transparent); }
      100% { box-shadow: 0 0 0 14px transparent; }
    }
    .track { position: relative; min-height: 220px; }
    .wire {
      position: absolute; left: 0; right: 0; top: 50%; height: 2px;
      background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px);
    }
    .wire.flow-right { animation: flow-r .5s linear infinite; }
    .wire.flow-left { animation: flow-l .5s linear infinite; }
    @keyframes flow-r { to { background-position: 14px 0; } }
    @keyframes flow-l { to { background-position: -14px 0; } }
    .barrier {
      position: absolute; left: 50%; top: 18%; bottom: 18%; width: 0;
      border-left: 3px solid var(--bad); opacity: 0; transition: opacity .3s;
    }
    .barrier span {
      position: absolute; top: -4px; left: 0; transform: translate(-50%, -100%);
      font-size: .72rem; font-weight: 600; color: var(--bad); white-space: nowrap;
    }
    .barrier.on { opacity: 1; }
    .envelope {
      position: absolute; left: 0; top: 0;
      opacity: 0;
      transition: translate var(--dur) cubic-bezier(.5,0,.3,1), opacity .25s;
    }
    .env-body {
      position: relative;
      background: var(--card);
      border: 2px solid var(--accent);
      border-radius: 999px;
      padding: 5px 12px;
      font: 600 .78rem ui-monospace, Menlo, monospace;
      white-space: nowrap;
      max-width: 210px;
      overflow: visible;
      box-shadow: 0 4px 14px rgba(0,0,0,.15);
    }
    .env-body .label { display: block; overflow: hidden; text-overflow: ellipsis; }
    .envelope.req .env-body { border-color: var(--browser); color: var(--browser); }
    .envelope.res .env-body { border-color: var(--server); color: var(--server); }
    .env-body .cookie {
      position: absolute; top: -12px; right: -10px; font-size: 1.1rem;
      transition: transform .6s ease-in, opacity .6s ease-in;
    }
    .envelope.strip .cookie { transform: translate(6px, 46px) rotate(160deg); opacity: 0; }
    .envelope.strip .env-body { animation: shake .4s; }
    @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    .message {
      margin-top: 14px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      padding: 8px 12px;
      min-height: 112px;
      transition: border-color .3s;
    }
    .message.req { border-color: var(--browser); }
    .message.res { border-color: var(--server); }
    .message .dir { font-weight: 600; font-size: .8rem; }
    .message.req .dir { color: var(--browser); }
    .message.res .dir { color: var(--server); }
    .message pre { margin: 4px 0 0; padding: 0; background: none; font-size: .82rem; }
    .message .hl { background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 3px; padding: 0 3px; }
    .message .hl.stripped { background: color-mix(in srgb, var(--bad) 20%, transparent); }
    .explain { font-size: 1.02rem; min-height: 3.2em; }
    .explain.fade { animation: fade .35s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .controls button:disabled { opacity: .4; cursor: default; }
    .progress { color: var(--muted); font-size: .9rem; margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .dots { display: flex; gap: 5px; }
    .dots button { width: 10px; height: 10px; padding: 0; border-radius: 50%; background: var(--line); border: none; }
    .dots button.done { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
    .dots button.now { background: var(--accent); transform: scale(1.3); }
    .scenes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .scenes button.active { background: var(--accent); color: var(--accent-fg); }
    .scenes button:not(.active) { background: transparent; color: var(--accent); }
    @media (max-width: 640px) {
      .stage { grid-template-columns: 1fr; }
      .actor { min-height: 0; }
      .track { min-height: 130px; }
      .wire { left: 50%; right: auto; top: 0; bottom: 0; width: 2px; height: auto;
        background: repeating-linear-gradient(180deg, var(--line) 0 8px, transparent 8px 14px); }
      .wire.flow-right { animation-name: flow-d; }
      .wire.flow-left { animation-name: flow-u; }
      @keyframes flow-d { to { background-position: 0 14px; } }
      @keyframes flow-u { to { background-position: 0 -14px; } }
      .barrier { left: 15%; right: 15%; top: 50%; bottom: auto; width: auto; height: 0; border-left: 0; border-top: 3px solid var(--bad); }
      .barrier span { left: auto; right: 0; transform: translateY(-100%); }
      .progress { margin-left: 0; width: 100%; justify-content: space-between; }
    }
    @media (prefers-reduced-motion: reduce) {
      .envelope, .env-body .cookie { transition: opacity .2s; }
      .jar .item.new, .actor.ping, .wire.flow-right, .wire.flow-left, .envelope.strip .env-body, .explain.fade { animation: none; }
    }
  </style>
</head>
<body>
<main>
  <nav class="top"><a href="index.html">← Lab home</a><a href="cookies.html">Playground</a><a href="auth.html">Auth demo</a></nav>
  <h1>How a cookie travels</h1>
  <p class="lead">Pick a scene and press <strong>Next</strong> (or <kbd>→</kbd>). Watch the request/response
    and the browser's cookie jar.</p>

  <div class="card">
    <div class="scenes" id="scenes"></div>
    <div class="stage">
      <div class="actor browser">
        <h3>🧭 Browser</h3>
        <div class="site" id="browserSite"></div>
        <div class="jar"><strong>Cookie jar</strong><div id="jar"></div></div>
      </div>
      <div class="track" id="track">
        <div class="wire" id="wire"></div>
        <div class="barrier" id="barrier"><span>SameSite=Lax: cookie stripped</span></div>
        <div class="envelope" id="envelope"><div class="env-body"><span class="label" id="envLabel"></span></div></div>
      </div>
      <div class="actor server">
        <h3>🖥️ Server</h3>
        <div class="site" id="serverSite"></div>
        <div class="jar"><strong>Server memory</strong><div id="serverMem"></div></div>
      </div>
    </div>
    <div class="message" id="message"></div>
    <p class="explain" id="explain" aria-live="polite"></p>
    <div class="controls">
      <button class="ghost" id="prev">← Prev</button>
      <button id="next">Next →</button>
      <button class="ghost" id="play">▶ Auto play</button>
      <span class="progress"><span class="dots" id="dots"></span><span id="progress"></span></span>
    </div>
  </div>
</main>
<script>
  // Each scene is a list of steps. A step can send a message (req = browser→server,
  // res = server→browser), and/or change the jar / server memory.
  const SCENES = [
    {
      title: '1. Login + Set-Cookie',
      browserSite: 'shop.com', serverSite: 'shop.com',
      steps: [
        { text: 'HTTP is stateless: each request is a stranger. The jar is empty, so the first request has no Cookie header.',
          jar: [], mem: [] },
        { kind: 'req', packet: 'POST /login\nHost: shop.com\n\nuser=pappu&pass=***',
          text: 'The browser sends the login form. No cookies yet.' },
        { text: 'The server checks the password, creates a random session id, and remembers it.',
          mem: ['sid a91f… → user: pappu'] },
        { kind: 'res', packet: 'HTTP/1.1 200 OK\nSet-Cookie: sid=a91f…; HttpOnly;\n  Secure; SameSite=Lax; Max-Age=3600',
          text: 'The response carries a Set-Cookie header. That is the server saying "please store this".' },
        { jar: ['sid=a91f… (HttpOnly, 1h, shop.com)'],
          text: 'The browser saves it in the jar, together with its rules: domain, path, expiry, flags.' },
      ],
    },
    {
      title: '2. Next requests send it back',
      browserSite: 'shop.com', serverSite: 'shop.com',
      steps: [
        { jar: ['sid=a91f… (HttpOnly, 1h, shop.com)'], mem: ['sid a91f… → user: pappu'],
          text: 'Later the user opens /cart. Before sending, the browser checks the jar: which cookies match this URL?' },
        { kind: 'req', packet: 'GET /cart\nHost: shop.com\nCookie: sid=a91f…',
          text: 'It adds a Cookie header by itself. Your JS code did nothing: this is automatic.' },
        { text: 'The server reads sid, looks it up in memory, and knows this is pappu. State over a stateless protocol!' },
        { kind: 'res', packet: 'HTTP/1.1 200 OK\n\n<h1>Pappu\'s cart</h1>',
          text: 'Note: the response does not need Set-Cookie again. The cookie stays until it expires.' },
      ],
    },
    {
      title: '3. Expiry + logout',
      browserSite: 'shop.com', serverSite: 'shop.com',
      steps: [
        { jar: ['sid=a91f… (HttpOnly, 1h, shop.com)', 'theme=dark (no Max-Age → session cookie)'],
          mem: ['sid a91f… → user: pappu'],
          text: 'Two kinds: a persistent cookie (has Max-Age/Expires) and a session cookie (no expiry, gone when the browser closes).' },
        { jar: ['sid=a91f… (HttpOnly, 1h, shop.com)', '~theme=dark (browser closed)'],
          text: 'User closes the browser: the session cookie is deleted. The persistent one survives.' },
        { kind: 'req', packet: 'POST /logout\nCookie: sid=a91f…', text: 'User clicks Log out.' },
        { mem: ['~sid a91f… (deleted on server)'],
          text: 'Good servers delete the session on the server too. Otherwise a stolen sid would still work.' },
        { kind: 'res', packet: 'HTTP/1.1 200 OK\nSet-Cookie: sid=; Max-Age=0; Path=/',
          text: 'To delete a cookie, the server sets it again with the same name + path and Max-Age=0.' },
        { jar: ['~sid=a91f… (expired)', '~theme=dark (browser closed)'],
          text: 'The browser removes it. The jar is clean.' },
      ],
    },
    {
      title: '4. Domain + Path matching',
      browserSite: 'shop.com/blog', serverSite: 'shop.com',
      steps: [
        { jar: ['sid=a91f… (Path=/)', 'adminTab=users (Path=/admin)', 'lang=hi (Domain=shop.com)'], mem: [],
          text: 'The jar has 3 cookies with different rules. The user visits shop.com/blog.' },
        { kind: 'req', packet: 'GET /blog\nHost: shop.com\nCookie: sid=a91f…; lang=hi',
          text: 'adminTab is NOT sent: its Path=/admin doesn\'t match /blog. Path matches by prefix, like folders.' },
        { browserSite: 'api.shop.com', kind: 'req', packet: 'GET /v1/me\nHost: api.shop.com\nCookie: lang=hi',
          text: 'On the subdomain api.shop.com only lang goes, because it had Domain=shop.com. Without a Domain attribute, a cookie is "host-only": just the exact host.' },
        { browserSite: 'evil.com', kind: 'req', packet: 'GET /\nHost: evil.com\n(no Cookie header)',
          text: 'evil.com gets nothing. A site can never read or set cookies for a different site.' },
      ],
    },
    {
      title: '5. Cross-site + SameSite (CSRF)',
      browserSite: 'evil.com page open', serverSite: 'bank.com',
      steps: [
        { jar: ['bank sid=77c… (SameSite=Lax)'], mem: ['sid 77c… → user: pappu, ₹10,000'],
          text: 'You are logged in to bank.com. Now you open evil.com in another tab.' },
        { kind: 'req', blocked: true, packet: 'POST bank.com/transfer\n(from a hidden form on evil.com)\nCookie: — not sent (Lax) —',
          text: 'evil.com auto-submits a form to bank.com. This is a cross-site POST, so a SameSite=Lax cookie is NOT attached.' },
        { kind: 'res', packet: 'HTTP/1.1 401 Unauthorized', text: 'The bank sees no session → the attack fails. 🎉' },
        { jar: ['bank sid=77c… (SameSite=None; Secure)'],
          text: 'But if the cookie were SameSite=None (old default behaviour), the browser WOULD attach it…' },
        { kind: 'req', packet: 'POST bank.com/transfer\nCookie: sid=77c…\n\nto=attacker&amount=5000',
          text: '…and the bank thinks you sent it. That is CSRF. evil.com never saw the cookie; it just made your browser use it.' },
        { text: 'Fix: keep SameSite=Lax/Strict AND require a CSRF token (or check the Origin header) for every state-changing request.' },
        { kind: 'req', packet: 'GET bank.com/statement\n(you clicked a normal link on evil.com)\nCookie: sid=77c… (Lax allows this)',
          text: 'Lax still sends the cookie on top-level GET navigation (clicking a link), so you stay logged in. Strict would not, even for links.' },
      ],
    },
  ];

  const $ = (id) => document.getElementById(id);
  let sceneIdx = 0, stepIdx = 0, timer = null, token = 0;
  const isNarrow = () => matchMedia('(max-width: 640px)').matches;
  const noMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DUR = 1300;
  $('envelope').style.setProperty('--dur', DUR + 'ms');

  // Apply steps 0..stepIdx so Prev works (state is rebuilt from scratch every time).
  function stateAt(scene, upto) {
    const st = { jar: [], mem: [], browserSite: scene.browserSite, serverSite: scene.serverSite };
    for (let i = 0; i <= upto; i++) {
      const s = scene.steps[i];
      if (s.jar) st.jar = s.jar;
      if (s.mem) st.mem = s.mem;
      if (s.browserSite) st.browserSite = s.browserSite;
    }
    return st;
  }

  // "name=value" pairs that actually travel in a request's Cookie header.
  function sentPairs(step) {
    if (step.kind !== 'req') return null;
    const line = step.packet.split('\n').find((l) => l.startsWith('Cookie:')) || '';
    return line.match(/\w+=[^\s;(]+/g) || [];
  }

  function renderList(el, items, prevItems, sent) {
    el.replaceChildren(...items.map((t) => {
      const d = document.createElement('div');
      d.className = 'item';
      if (t.startsWith('~')) { d.classList.add('gone'); t = t.slice(1); }
      else {
        if (!prevItems.includes(t)) d.classList.add('new');
        if (sent) {
          const pair = (t.match(/\w+=[^\s;(]+/) || [''])[0];
          d.classList.add(sent.includes(pair) ? 'sent' : 'held');
        }
      }
      d.textContent = t;
      return d;
    }));
    if (!items.length) el.innerHTML = '<div class="muted">(empty)</div>';
  }

  function renderMessage(step) {
    const m = $('message');
    m.className = 'message' + (step.kind ? ' ' + step.kind : '');
    if (!step.kind) {
      m.innerHTML = '<span class="muted">Nothing on the wire in this step. Watch the boxes above.</span>';
      return;
    }
    const dir = document.createElement('div');
    dir.className = 'dir';
    dir.textContent = step.kind === 'req' ? 'Request: browser → server' : 'Response: server → browser';
    const pre = document.createElement('pre');
    step.packet.split('\n').forEach((line, i) => {
      if (i) pre.append('\n');
      if (/^(Set-)?Cookie:/.test(line)) {
        const span = document.createElement('span');
        span.className = 'hl' + (step.blocked ? ' stripped' : '');
        span.textContent = line;
        pre.append(span);
      } else pre.append(line);
    });
    m.replaceChildren(dir, pre);
  }

  function ping(el) {
    el.classList.remove('ping');
    void el.offsetWidth; // restart the animation
    el.classList.add('ping');
  }

  // Start/end positions in px inside the track, for the envelope's current size.
  function ends(kind) {
    const tr = $('track'), env = $('envelope');
    const tw = tr.clientWidth, th = tr.clientHeight, ew = env.offsetWidth, eh = env.offsetHeight;
    const a = isNarrow()
      ? [[(tw - ew) / 2, 0], [(tw - ew) / 2, th - eh]]
      : [[0, (th - eh) / 2], [tw - ew, (th - eh) / 2]];
    return kind === 'req' ? a : [a[1], a[0]];
  }

  function animateMessage(step) {
    const t = ++token;
    const env = $('envelope'), wire = $('wire'), barrier = $('barrier');
    barrier.classList.remove('on');
    wire.className = 'wire';
    if (!step.kind) { env.style.opacity = 0; return; }

    env.className = 'envelope ' + step.kind;
    $('envLabel').textContent = (step.kind === 'req' ? '→ ' : '← ') + step.packet.split('\n')[0];
    env.querySelector('.cookie')?.remove();
    const carriesCookie = step.blocked ||
      (step.kind === 'req' ? sentPairs(step).length > 0 : /^Set-Cookie: \w+=[^;\s]/m.test(step.packet));
    if (carriesCookie) {
      const c = document.createElement('span');
      c.className = 'cookie';
      c.textContent = '🍪';
      env.firstElementChild.append(c);
    }

    const [from, to] = ends(step.kind);
    env.style.transition = 'none';
    env.style.translate = `${from[0]}px ${from[1]}px`;
    env.style.opacity = 1;
    void env.offsetWidth; // force reflow so the transition restarts
    env.style.transition = '';
    const receiver = document.querySelector(step.kind === 'req' ? '.actor.server' : '.actor.browser');

    if (noMotion()) {
      env.style.translate = `${to[0]}px ${to[1]}px`;
      if (step.blocked) { barrier.classList.add('on'); env.classList.add('strip'); }
      return;
    }
    env.style.translate = `${to[0]}px ${to[1]}px`;
    wire.classList.add(step.kind === 'req' ? 'flow-right' : 'flow-left');
    if (step.blocked) {
      setTimeout(() => { if (t !== token) return; barrier.classList.add('on'); env.classList.add('strip'); }, DUR * 0.45);
    }
    setTimeout(() => {
      if (t !== token) return;
      wire.className = 'wire';
      ping(receiver);
    }, DUR);
  }

  function render() {
    const scene = SCENES[sceneIdx];
    const st = stateAt(scene, stepIdx);
    const prev = stepIdx > 0 ? stateAt(scene, stepIdx - 1) : { jar: [], mem: [] };
    const step = scene.steps[stepIdx];
    $('browserSite').textContent = st.browserSite;
    $('serverSite').textContent = st.serverSite;
    renderList($('jar'), st.jar, prev.jar, sentPairs(step));
    renderList($('serverMem'), st.mem, prev.mem, null);
    // Steps with no message happen inside one actor: pulse whoever changed.
    if (!step.kind) {
      if (step.jar && stepIdx > 0) ping(document.querySelector('.actor.browser'));
      if (step.mem && stepIdx > 0) ping(document.querySelector('.actor.server'));
    }
    const ex = $('explain');
    ex.textContent = step.text;
    ex.classList.remove('fade'); void ex.offsetWidth; ex.classList.add('fade');
    renderMessage(step);
    animateMessage(step);

    $('progress').textContent = `Step ${stepIdx + 1} / ${scene.steps.length}`;
    $('dots').replaceChildren(...scene.steps.map((_, i) => {
      const d = document.createElement('button');
      d.className = i < stepIdx ? 'done' : i === stepIdx ? 'now' : '';
      d.setAttribute('aria-label', `Go to step ${i + 1}`);
      d.onclick = () => { stop(); stepIdx = i; render(); };
      return d;
    }));
    $('prev').disabled = sceneIdx === 0 && stepIdx === 0;
    $('next').disabled = atEnd();
    [...$('scenes').children].forEach((b, i) => b.classList.toggle('active', i === sceneIdx));
  }

  const atEnd = () => sceneIdx === SCENES.length - 1 && stepIdx === SCENES[sceneIdx].steps.length - 1;
  function next() {
    if (stepIdx < SCENES[sceneIdx].steps.length - 1) stepIdx++;
    else if (sceneIdx < SCENES.length - 1) { sceneIdx++; stepIdx = 0; }
    else { stop(); return; }
    render();
    if (atEnd()) stop();
  }
  function prevStep() {
    if (stepIdx > 0) stepIdx--;
    else if (sceneIdx > 0) { sceneIdx--; stepIdx = SCENES[sceneIdx].steps.length - 1; }
    render();
  }
  function stop() { clearInterval(timer); timer = null; $('play').textContent = '▶ Auto play'; }

  SCENES.forEach((s, i) => {
    const b = document.createElement('button');
    b.textContent = s.title;
    b.onclick = () => { stop(); sceneIdx = i; stepIdx = 0; render(); };
    $('scenes').append(b);
  });
  $('next').onclick = () => { stop(); next(); };
  $('prev').onclick = () => { stop(); prevStep(); };
  $('play').onclick = () => {
    if (timer) return stop();
    if (atEnd()) { sceneIdx = 0; stepIdx = 0; render(); }
    $('play').textContent = '⏸ Pause';
    timer = setInterval(next, 3600);
  };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { stop(); next(); }
    if (e.key === 'ArrowLeft') { stop(); prevStep(); }
  });
  // Keep the envelope parked at its end point when the layout changes size.
  addEventListener('resize', () => {
    const step = SCENES[sceneIdx].steps[stepIdx];
    if (!step.kind) return;
    const env = $('envelope'), [, to] = ends(step.kind);
    env.style.transition = 'none';
    env.style.translate = `${to[0]}px ${to[1]}px`;
  });
  render();
</script>
</body>
</html>
